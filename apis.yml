description: Honor (Honor Technology, Inc.) is a San Francisco-based home care
  company that pairs a high-touch, non-medical in-home care network for aging
  adults with a proprietary technology and operations platform - the Honor Care
  Platform - covering caregiver ("Care Pro") scheduling and matching, client care
  plans, visit management, and back-office operations. In August 2021 Honor
  acquired Home Instead, the world's largest senior home care franchise network,
  which now operates as a subsidiary of Honor; the Honor Care Platform powers both
  the Honor Care Network and Home Instead franchise offices. Honor exposes its
  platform to internal staff and to caregivers and families through the Honor
  Care Pro and Honor Family mobile apps and a client web portal. As of this
  writing Honor publishes NO public or partner developer API, developer portal,
  or API reference documentation - the platform is a closed, first-party
  care-delivery operations system rather than an API product. This entry is
  therefore a documentation stub kept for catalog completeness; it will be updated
  if Honor ever ships a documented public or partner API.
